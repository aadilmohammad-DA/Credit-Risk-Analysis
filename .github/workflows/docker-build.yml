name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'   # Run on ALL branches automatically

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare variables
        id: vars
        run: |
          # Lowercase repo owner (your username)
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')

          # Sanitize branch name (replace / with - and lowercase)
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

          # Set outputs
          echo "OWNER=$OWNER" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          IMAGE="ghcr.io/${{ steps.vars.outputs.OWNER }}/credit-risk-api:${{ steps.vars.outputs.BRANCH_NAME }}"
          docker build -t $IMAGE .

      - name: Push Docker image
        run: |
          IMAGE="ghcr.io/${{ steps.vars.outputs.OWNER }}/credit-risk-api:${{ steps.vars.outputs.BRANCH_NAME }}"
          docker push $IMAGE

      - name: Tag and push production image (master only)
        if: github.ref == 'refs/heads/master'
        run: |
          IMAGE="ghcr.io/${{ steps.vars.outputs.OWNER }}/credit-risk-api"
          docker tag $IMAGE:${{ steps.vars.outputs.BRANCH_NAME }} $IMAGE:latest
          docker push $IMAGE:latest
