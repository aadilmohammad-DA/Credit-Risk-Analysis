name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'   # Run on ALL branches automatically

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for this branch
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/credit-risk-api:${{ github.ref_name }} .

      - name: Push branch image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/credit-risk-api:${{ github.ref_name }}

      - name: Tag and push production image (only for master)
        if: github.ref == 'refs/heads/master'
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/credit-risk-api:master \
                     ghcr.io/${{ github.repository_owner }}/credit-risk-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/credit-risk-api:latest