name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'   # Run on ALL branches automatically

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize names
        id: vars
        run: |
          SANITIZED_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          SANITIZED_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "BRANCH_NAME=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT
          echo "OWNER=$SANITIZED_OWNER" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ steps.vars.outputs.OWNER }}/credit-risk-api:${{ steps.vars.outputs.BRANCH_NAME }} .

      - name: Push image
        run: |
          docker push ghcr.io/${{ steps.vars.outputs.OWNER }}/credit-risk-api:${{ steps.vars.outputs.BRANCH_NAME }}


      - name: Tag and push production image
        if: github.ref == 'refs/heads/master'
        run: |
          docker tag ghcr.io/${{ steps.vars.outputs.OWNER }}/credit-risk-api:${{ steps.vars.outputs.BRANCH_NAME }} \
                    ghcr.io/${{ steps.vars.outputs.OWNER }}/credit-risk-api:latest
          docker push ghcr.io/${{ steps.vars.outputs.OWNER }}/credit-risk-api:latest
